<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git 노선도 — 브랜치가 어떻게 갈라지고 만나는지 눈으로 보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<!-- 파비콘도 파일 안에 둔다(단일 HTML 유지). 갈라지는 두 노선과 환승역 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23EDF0F5'/%3E%3Cpath d='M10 24h18c8 0 8 16 16 16h10' stroke='%23EF7C1C' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3Cpath d='M10 24h44' stroke='%230052A4' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='28' cy='24' r='7' fill='%23fff' stroke='%230052A4' stroke-width='5'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#EDF0F5;
    --paper-2:#FFFFFF;
    --ink:#141C26;
    --ink-soft:#5B6876;
    --rule:#D3DAE3;
    --head:#E6186C;
    --shadow:0 1px 2px rgba(20,28,38,.06), 0 8px 24px rgba(20,28,38,.07);
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, "D2Coding", monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:24px 20px 48px}

  header.top{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:20px;flex-wrap:wrap;
    padding-bottom:14px;margin-bottom:18px;
    border-bottom:2px solid var(--ink);
  }
  h1{
    margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;
  }
  h1 .sub{display:block;font-size:13px;font-weight:500;letter-spacing:0;color:var(--ink-soft);margin-top:7px}
  .modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .modes button{
    font-family:inherit;font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:999px;cursor:pointer;
    border:1.5px solid var(--rule);background:var(--paper-2);color:var(--ink-soft);
    transition:all .15s;
  }
  .modes button:hover{border-color:var(--ink-soft)}
  .modes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  /* 시나리오는 한 묶음으로 다닌다. 버튼마다 "시나리오 ·"를 반복하지 않으므로
     항목을 더 넣어도 줄이 잘 늘지 않는다. 넘치면 묶음 안에서 접힌다 */
  .modes .group{
    display:flex;align-items:center;gap:5px;flex-wrap:wrap;
    padding:4px 5px 4px 11px;border-radius:999px;
    border:1.5px solid var(--rule);background:var(--paper-2);
  }
  .modes .group > .lbl{font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
  .modes .group button{border-color:transparent;background:transparent;padding:7px 12px}
  .modes .group button:hover{border-color:var(--rule)}
  /* 묶음 안 규칙보다 뒤에 와야 선택 상태가 덮이지 않는다 */
  .modes .group button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  /* 노선도(1행)와 진행 순서·로그(2행)가 왼쪽에 쌓이고, 조작판이 두 행에 걸친다.
     예전처럼 조작판 한 열에 다 넣으면 세로 862px가 되어 로그가 화면 밖으로 밀렸다 */
  .grid{
    display:grid;grid-template-columns:1fr 330px;grid-template-rows:auto auto;
    gap:18px;align-items:start
  }
  .panel.map    {grid-column:1;grid-row:1}
  .panel.work   {grid-column:1;grid-row:2}
  .panel.console{grid-column:2;grid-row:1 / span 2}
  /* 조작판을 넓혀 두 묶음을 나란히 세운다. 1400px 미만에서는 노선도 폭을 지킨다
     — Rebase의 그래프가 715px까지 뻗어 좁히면 가로 스크롤이 생긴다 */
  /* 조작판을 넓히면 그만큼 노선도가 줄어든다. .wrap 상한(1240px)을 같이 올리지 않으면
     Rebase의 그래프(715px)가 안 들어가 가로 스크롤이 생긴다 */
  @media (min-width:1400px){
    .wrap{max-width:1500px}
    .grid{grid-template-columns:1fr 560px}
  }
  @media (max-width:900px){
    .grid{grid-template-columns:1fr}
    .panel.map,.panel.work,.panel.console{grid-column:1;grid-row:auto}
  }

  .panel{background:var(--paper-2);border:1.5px solid var(--rule);border-radius:14px;box-shadow:var(--shadow)}

  /* ── 노선도 ── */
  .map{padding:6px;overflow:hidden;position:relative}
  .map-scroll{overflow-x:auto;overflow-y:hidden}
  /* 구역 머리글은 가로 스크롤을 따라가면 안 되므로 SVG 밖에 얹는다 */
  .zone{
    position:absolute;left:12px;padding:1px 7px;border-radius:7px;
    font-size:11.5px;font-weight:700;letter-spacing:.2px;pointer-events:none
  }
  .zone-local{color:#8A96A4;background:rgba(255,255,255,.88)}
  .zone-remote{color:var(--ink-soft);background:#F1F5FA}
  svg{display:block}
  .legend{
    display:flex;gap:16px;flex-wrap:wrap;align-items:center;
    padding:6px 8px 10px;border-bottom:1.5px dashed var(--rule);margin-bottom:6px;
    font-size:12px;color:var(--ink-soft)
  }
  .legend b{color:var(--ink);font-weight:700}
  .lg{display:flex;align-items:center;gap:6px}
  .lg i{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink-soft);background:#fff;display:inline-block}
  .lg i.transfer{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 4px var(--ink)}
  .lg i.ghost{border-style:dotted;opacity:.5}
  .lg i.unfetched{border-style:dashed;border-color:#5B6876;opacity:.8}
  .lg i.headmark{width:22px;height:12px;border:none;border-radius:999px;background:var(--head)}
  .lg i.remote{width:22px;height:12px;border:2px solid #5B6876;border-radius:999px;background:#fff}
  /* 방금 실행한 명령. 자기 줄을 가져야 폭이 보장된다 — 범례 줄 끝에 얹었을 때는
     남는 자리가 1200px에서 249px, 950px에서 0까지 줄어 잘렸다.
     block + nowrap + overflow:hidden 조합이라야 ellipsis가 먹는다 (flex면 안 먹는다).
     명령이 없을 때도 높이를 예약한다. 접었다 펴면 첫 실행에서 노선도가 툭 내려간다 */
  .cmdbar{
    height:36px;line-height:36px;padding:0 12px;margin-bottom:8px;border-radius:8px;
    background:var(--paper);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--mono);font-size:15px;font-weight:800;color:var(--ink)
  }
  .cmdbar::before{content:"$ ";color:var(--head)}
  /* 거절은 배경까지 칠한다. 뒷자리에서 "막혔다"가 즉시 읽혀야 한다 */
  .cmdbar.e{color:#B02A37;background:#FCEBEC}
  /* 명령이 아니라 팀원·GitHub이 한 일. $를 붙이면 옮겨 칠 것으로 오해한다 */
  .cmdbar.n{color:var(--ink-soft);font-weight:600;font-size:13.5px}
  .cmdbar.n::before{content:""}
  .cmdbar.empty{color:var(--ink-soft);background:transparent;font-family:inherit;font-size:12.5px;font-weight:600}
  .cmdbar.empty::before{content:""}
  /* 한 열로 접히는 폭부터는 사이드바가 노선도 바로 아래로 내려와 명령이 이미 가깝다 */
  @media (max-width:900px){ .cmdbar{display:none} }

  /* ── 조작판 ── */
  .console{padding:16px;display:flex;flex-direction:column;gap:14px}
  /* 기본은 한 열. 1400px 이상에서만 두 열로 갈라진다 */
  #freePanel{display:grid;grid-template-columns:1fr;align-items:start}
  /* 한 열로 쌓일 때만 두 묶음 사이를 띄운다. 두 열이면 나란히 서므로 필요 없다 */
  #freePanel .cmdcol + .cmdcol h2{margin-top:14px}
  /* ── 진행 순서 + 실행한 명령 ── */
  /* stepPanel이 display:none인 자유 모드에서는 로그가 자리를 다 쓴다 (JS 분기 불필요) */
  .work{padding:16px;display:flex;gap:18px;align-items:flex-start}
  .work #stepPanel{flex:0 0 296px}
  .work .logwrap{flex:1;min-width:0}
  @media (max-width:900px){ .work{flex-direction:column} .work #stepPanel{flex:none;width:100%} }
  /* 조작판 두 열 — 위 .grid 쪽 미디어 쿼리에 두면 뒤에 오는 #freePanel 기본 규칙에 덮인다 */
  @media (min-width:1400px){
    #freePanel{grid-template-columns:1fr 1fr;gap:0 14px}
    #freePanel .span2{grid-column:1 / -1}
    #freePanel .cmdcol + .cmdcol h2{margin-top:0}
  }
  .console h2, .work h2{
    margin:0;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft)
  }
  .row{display:flex;gap:6px}
  .row > *{min-width:0}
  input[type=text],select{
    flex:1;font-family:inherit;font-size:13px;padding:8px 10px;
    border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)
  }
  input:focus,select:focus,button:focus-visible{outline:2.5px solid var(--head);outline-offset:1px}
  .act{
    font-family:inherit;font-size:13px;font-weight:700;white-space:nowrap;
    padding:8px 12px;border-radius:8px;cursor:pointer;
    border:1.5px solid var(--ink);background:var(--ink);color:#fff;transition:transform .1s, opacity .15s
  }
  .act:hover{opacity:.85}
  .act:active{transform:translateY(1px)}
  .act.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
  .act.ghost:hover{border-color:var(--ink)}
  /* :hover 규칙보다 뒤에 와야 덮인다(특정도가 같다). 끝났습니다·이전·안내 이전 버튼이 함께 걸린다 */
  .act:disabled{opacity:.32;cursor:default;border-color:var(--rule)}

  .now{
    font-size:13px;padding:10px 12px;border-radius:8px;
    background:var(--paper);border:1.5px solid var(--rule)
  }
  .now .k{font-size:11px;letter-spacing:.1em;color:var(--ink-soft);font-weight:700}
  .now .v{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:3px}

  .note{
    font-size:13px;line-height:1.55;padding:11px 12px;border-radius:8px;
    background:#FFF4F8;border:1.5px solid #FAD3E1;color:#7A1038;min-height:44px
  }
  .note code{font-family:var(--mono);font-size:12px;background:#fff;padding:1px 5px;border-radius:4px}
  /* 설명이 여러 문단인 단계가 있다 (PR 열기). 문단 사이만 띄우고 위아래 여백은 패딩에 맡긴다 */
  .note p{margin:0 0 8px}
  .note p:last-child{margin-bottom:0}
  /* 담긴 변경(스테이징). 커밋 전에 무엇이 담겼는지 보여주는 자리 */
  .staged{
    display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:7px 10px;
    border:1.5px dashed #7FB069;border-radius:9px;background:#F3F8F0;font-size:12.5px
  }
  .staged[hidden]{display:none}     /* .staged의 display:flex가 [hidden] 기본값을 덮는다 */
  .staged .k{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#4A7A38;white-space:nowrap}
  .staged span:last-child{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .log{
    max-height:210px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.7;
    background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:9px 11px
  }
  .log div{white-space:pre-wrap;word-break:break-all}
  .log .c{color:var(--ink)}
  .log .c::before,.log .e::before{content:"$ ";color:var(--head);font-weight:700}
  .log .e{color:#B02A37}
  .log .n{color:var(--ink-soft)}
  /* 명령이 터미널에 뿌린 출력. $도 #도 아니라 옮겨 칠 대상이 아니다 */
  .log .o{color:var(--ink-soft);opacity:.8}
  .log .empty{color:var(--ink-soft);font-family:inherit}
  /* 저장소를 만들 때 한 번만 치는 명령. 아래 기록과 섞이지 않게 흐리게 구분한다 */
  .log .setup{color:#8A96A4}
  .log .setup .h{display:block;color:#9AA5B1;font-family:inherit;font-size:11px;font-weight:700;margin-bottom:2px}
  .log .setup + .c, .log .setup + .e{margin-top:6px;padding-top:6px;border-top:1px dashed var(--rule)}

  .steps{font-size:13px;line-height:1.55}
  .steps .cmd{font-family:var(--mono);font-size:12.5px;font-weight:700;display:block;margin-bottom:5px}
  .steps .done{color:var(--ink-soft)}

  /* ── 자동 안내 ── */
  .tour-cta{
    font-family:inherit;font-size:13px;font-weight:800;
    padding:8px 16px;border-radius:999px;cursor:pointer;
    border:1.5px solid var(--head);background:var(--head);color:#fff;
    transition:opacity .15s
  }
  .tour-cta:hover{opacity:.85}
  /* 어둡게 덮는 건 막(mask) 쪽이고, 밝힐 자리는 clip-path로 뚫는다.
     구멍을 두 개 뚫을 수 있어야 "누른 버튼 + 바뀐 노선도"를 함께 보여줄 수 있다.
     box-shadow 방식은 겹칠 때마다 어둠이 누적돼 두 곳을 못 밝힌다 */
  .tour-mask{
    position:fixed;inset:0;z-index:50;background:rgba(12,18,26,.6);
    transition:clip-path .35s cubic-bezier(.4,0,.2,1)
  }
  .tour-mask.solo{background:transparent}          /* clip-path 미지원 대비 */
  .tour-hole{
    position:fixed;z-index:51;border-radius:14px;pointer-events:none;
    box-shadow:0 0 0 3px var(--head);
    transition:top .35s cubic-bezier(.4,0,.2,1), left .35s cubic-bezier(.4,0,.2,1),
               width .35s cubic-bezier(.4,0,.2,1), height .35s cubic-bezier(.4,0,.2,1);
  }
  .tour-mask.solo ~ .tour-hole{ box-shadow:0 0 0 9999px rgba(12,18,26,.6), 0 0 0 3px var(--head) }
  /* 함께 밝힌 두 번째 자리는 테두리를 옅게 — 지금 눌린 곳과 구분된다 */
  .tour-hole2{
    position:fixed;z-index:51;border-radius:14px;pointer-events:none;opacity:0;
    box-shadow:0 0 0 2px rgba(230,24,108,.45);
    transition:top .35s cubic-bezier(.4,0,.2,1), left .35s cubic-bezier(.4,0,.2,1),
               width .35s cubic-bezier(.4,0,.2,1), height .35s cubic-bezier(.4,0,.2,1),
               opacity .25s ease;
  }
  .tour-tip{
    position:fixed;z-index:52;left:50%;bottom:22px;transform:translateX(-50%);
    width:min(600px,calc(100vw - 28px));
    background:#fff;border-radius:16px;padding:16px 18px 12px;
    box-shadow:0 18px 50px rgba(0,0,0,.32);
    transition:top .25s ease;
  }
  /* 좁은 화면은 말풍선을 화면 아래 고정하므로, 강조 대상을 그 위로
     끌어올릴 수 있도록 높이만큼 페이지 여백을 확보한다 */
  body.tour-on .wrap{padding-bottom:var(--tour-pad,48px)}
  .tour-tip .meta{
    display:flex;align-items:center;gap:8px;
    font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--head);margin-bottom:6px
  }
  .tour-tip h3{margin:0 0 6px;font-size:17px;font-weight:800;letter-spacing:-.02em}
  .tour-tip p{margin:0;font-size:14px;line-height:1.65;color:#33404E}
  .tour-tip p code{font-family:var(--mono);font-size:12.5px;background:var(--paper);padding:1px 5px;border-radius:4px}
  .tour-tip p b{color:var(--ink)}
  .tour-ctl{display:flex;gap:6px;align-items:center;margin-top:13px}
  .tour-ctl button{
    font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:8px;cursor:pointer;
    border:1.5px solid var(--rule);background:#fff;color:var(--ink)
  }
  .tour-ctl button:hover{border-color:var(--ink)}
  .tour-ctl button.pri{background:var(--ink);border-color:var(--ink);color:#fff}
  .tour-ctl .sp{flex:1}
  .tour-tip .meta .num{color:var(--ink-soft);letter-spacing:.04em}
  /* 진행 막대는 단계 하나당 한 칸. 칸을 누르면 그 단계로 건너뛴다. 장이 바뀌는 칸은 앞에 틈을 둔다 */
  .tour-bar{display:flex;gap:2px;margin-top:11px}
  .tour-bar .seg{flex:1;min-width:3px;height:12px;padding:4px 0 5px;border:0;background:none;cursor:pointer}
  .tour-bar .seg.br{margin-left:12px}
  .tour-bar .seg i{display:block;height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
  .tour-bar .seg i b{display:block;height:100%;width:0;background:var(--head);border-radius:2px}
  .tour-bar .seg.done i b{width:100%}
  .tour-bar .seg:hover i{background:#B9C2CD}
  .tour-bar .seg:focus-visible{outline:2px solid var(--head);outline-offset:2px;border-radius:3px}

  /* 애니메이션 */
  @keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
  @keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
  .enter{animation:pop .34s cubic-bezier(.34,1.56,.64,1) both}
  .edge-enter{animation:draw .4s ease-out both}
  /* 받아온 역이 서버 구역에서 내 구역으로 올라오는 이동.
     translate만 건드린다 — 크기 애니메이션은 안쪽 그룹(gi)이 따로 맡는다 */
  .node-move{transition:transform .5s cubic-bezier(.32,.72,.28,1)}
  /* 자리가 바뀐 선로는 새 자리에서 서서히 나타난다.
     양 끝이 따로 움직이므로 선을 이어서 끌고 갈 수가 없다 */
  .edge-fade{animation:edgeFade .5s ease-out backwards}
  @keyframes edgeFade{from{opacity:0}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1>Git 노선도
      <span class="sub">커밋은 역, 브랜치는 노선, 병합 커밋은 환승역입니다. 버튼을 눌러 선로가 어떻게 깔리는지 확인하세요.</span>
    </h1>
    <div class="modes" id="modes">
      <button class="tour-cta" id="btnTour" style="margin-right:8px">▶ 자동 안내</button>
      <button data-mode="free" aria-pressed="true">자유 모드</button>
      <span class="group" role="group" aria-label="시나리오">
        <span class="lbl">시나리오</span>
        <button data-mode="commit" aria-pressed="false">Commit</button>
        <button data-mode="merge" aria-pressed="false">Merge</button>
        <button data-mode="push" aria-pressed="false">Push</button>
        <button data-mode="pr" aria-pressed="false">PR</button>

           무엇을 쳐서 무엇이 달라졌는지 한눈에 안 들어왔다. 그래프 오른쪽 빈 공간은

    <!-- 진행 순서와 로그는 노선도 아래 왼쪽으로 내린다. 조작판에 두면 세로로만 늘어나
         화면 밖으로 밀리고, 로그는 330px에 갇혀 명령마다 두 줄로 접혔다.
         둘을 갈라 놓지 않는 이유 — 진행 순서와 로그는 줄이 1:1로 맞아야 옮겨 칠 때 안 헷갈린다 -->

      <div class="logwrap">

<script>
"use strict";
const COLORS = ["#0052A4","#EF7C1C","#00A84D","#996CAC","#00A5DE","#B5651D"];
const COL_W = 112, ROW_H0 = 104, PAD_X = 66, PAD_Y = 66, LBL_GAP = 23;
// 노선도 아래 "팀 공용 서버" 띠. 원격 이름표만 여기 모아 내 컴퓨터와 경계를 긋는다
const BAND_H = 58, BAND_GAP = 10, BAND_CAP = 22;
// 원격 저장소. 처음엔 main만 추적한다. 로컬 브랜치는 push 해야 origin/<이름>이 생긴다
const RPFX = "origin/", REMOTE = RPFX + "main", REMOTE_COLOR = "#5B6876";
// 원격 주소. 로그 머리말·clone·remote add가 같은 문자열을 쓴다
const ORIGIN_URL = "https://github.com/팀/저장소.git";
const remoteOf = name => S.branches[RPFX + name];
const remotes = () => Object.values(S.branches).filter(b => b.remote);

let S, undoStack = [], seenNodes = new Set(), seenEdges = new Set();
// 직전 render의 역 좌표. 자리가 바뀐 역을 이전 자리에서 새 자리로 옮겨 그린다
// (pull로 받아온 역이 서버 구역에서 내 구역으로 올라오는 것을 보여준다)
let prevPos = new Map();
let mode = "free", scenario = null, stepIdx = 0;
// 시나리오 "이전 단계"용. undoStack과 따로 쌓는다 — 거절 단계는 snap()을 부르지 않아
// undoStack이 한 칸 어긋난다(cmdCommit·cmdPush의 거절 경로). 단계 실행 직전 상태를 통째로 담는다
let stepStack = [];

const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
// 커밋 메시지·브랜치 이름은 사용자가 입력한다. HTML로 넣기 전에 반드시 통과시킬 것.
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// SVG 글자 폭 실측용. 이름표 알약 크기를 글자 수로 어림잡으면 한글에서 넘친다
const LBL_FONT = '11.5px "Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif';
const _mctx = document.createElement("canvas").getContext("2d");
const _wcache = new Map();
function textW(s, weight){
  const k = weight + "|" + s;
  if(_wcache.has(k)) return _wcache.get(k);
  _mctx.font = weight + " " + LBL_FONT;
  const w = _mctx.measureText(s).width;
  _wcache.set(k, w);
  return w;
}

/* ───────── 상태 ───────── */
// withRemote=false면 원격 없이 시작한다 (시나리오 모드는 원격을 다루지 않는다)
// S.origin은 "원격 주소를 등록해 뒀는가"(.git/config)다. 서버에 무엇이 올라가 있는지와 다른 이야기라
// origin/main 이름표와 따로 둔다 — git remote add는 주소만 적고 아무것도 주고받지 않는다
function fresh(withRemote){
  S = { commits:{}, order:[], branches:{}, head:"main", laneNext:0, log:[], staged:null, origin:null };
  makeBranch("main");
  doCommit("최초 커밋");
  // 원격은 같은 역에서 출발한다. lane 번호를 새로 쓰지 않아 로컬 브랜치 색이 밀리지 않는다
  // 선로 색은 main과 같게 둔다("노선 = 색" 규칙 유지). 원격임은 이름표 모양으로만 구분
  // head = 서버의 실제 위치, known = 내가 fetch로 받아 아는 위치. 둘이 벌어진 구간이 "아직 안 받은 역"
  if(withRemote !== false){
    S.origin = ORIGIN_URL;
    S.branches[REMOTE] = { name:REMOTE, head:S.branches.main.head, known:S.branches.main.head,
                           lane:S.branches.main.lane, color:S.branches.main.color, remote:true };
  }
  S.log = [];
  undoStack = [];
}
// 서버에는 팀이 만들어 둔 저장소가 있고 내 컴퓨터는 비어 있는 상태.
// head가 빈 문자열이면 "아직 내 저장소가 없다"는 뜻이다 (clone 전)
function freshClone(){
  // clone은 주소를 받아 통째로 복사하는 명령이라 origin 등록도 clone이 대신 해 준다
  S = { commits:{}, order:[], branches:{}, head:"", laneNext:0, log:[], staged:null, origin:ORIGIN_URL };
  const mkRemote = (name, base) => {
    const r = { name:RPFX + name, head:base, known:base,
                lane:S.laneNext, color:COLORS[S.laneNext % COLORS.length], remote:true };
    S.laneNext++;
    S.branches[r.name] = r;
    return r;
  };
  // 서버 커밋은 원격 이름표 자리에서 만든다 (cmdTeamCommit과 같은 방식)
  const rm = mkRemote("main", null);
  S.head = rm.name;
  doCommit("최초 커밋");
  doCommit("맵 데이터 추가");
  // develop은 main에서 갈라져 한 칸 더 나가 있다 — 그래야 develop으로 가야 할 이유가 보인다
  const rd = mkRemote("develop", rm.head);
  S.head = rd.name;
  doCommit("사운드 매니저");
  // 서버에 있는 것을 그대로 보여준다. doCommit은 head만 옮기므로 known을 따로 맞춰야
  // 이름표가 붙고("아직 받지 않은 역"으로 흐려지지 않고) 서버 상태가 한눈에 보인다
  remotes().forEach(r => { r.known = r.head; });
  S.head = "";                 // 내 컴퓨터에는 아직 아무것도 없다
  S.log = [];
  undoStack = [];
}
// 아무것도 없는 빈 폴더. git init 전이라 브랜치도 커밋도 없다 (commit 시나리오의 출발점)
function freshEmpty(){
  S = { commits:{}, order:[], branches:{}, head:"", laneNext:0, log:[], staged:null, origin:null };
  undoStack = [];
}
function hash(){
  let h; do { h = Math.random().toString(16).slice(2,9); } while (S.commits[h]);
  return h;
}
function makeBranch(name){
  S.branches[name] = { name, head:null, lane:S.laneNext, color:COLORS[S.laneNext % COLORS.length] };
  S.laneNext++;
}
const cur = () => S.branches[S.head];
function snap(){ undoStack.push(clone(S)); if(undoStack.length>60) undoStack.shift(); }

function ancestors(id){
  const out = new Set(); if(!id) return out;
  const stack=[id];
  while(stack.length){
    const x = stack.pop();
    if(!x || out.has(x)) continue;
    out.add(x);
    (S.commits[x].parents||[]).forEach(p=>stack.push(p));
  }
  return out;
}
const isAncestor = (a,b) => !!a && ancestors(b).has(a);

/* ───────── 명령 ───────── */
function doCommit(msg){
  const b = cur();
  // 지금 서 있는 역에서 같은 줄로 이미 선로가 뻗어 있으면(원격이 앞서 나간 경우 등)
  // 새 줄로 갈라진다. 색은 유지해서 같은 노선임을 보여준다
  if(b.head && S.order.some(id => S.commits[id].lane===b.lane && S.commits[id].parents.includes(b.head)))
    b.lane = S.laneNext++;
  const id = hash();
  S.commits[id] = { id, parents: b.head?[b.head]:[], lane:b.lane, msg, color:b.color };
  S.order.push(id);
  b.head = id;
  return id;
}
// git add — 바꾼 것을 "담는" 단계. 담기지 않은 건 커밋되지 않는다
function doStage(msg){ S.staged = msg; log(`git add .`); }
// git init — 빈 폴더를 저장소로 만든다. 브랜치 이름만 정해지고 역은 하나도 생기지 않는다
function cmdInit(){
  if(S.head) return say("이미 내 컴퓨터에 저장소가 있습니다.");
  snap();
  makeBranch("main");
  S.head = "main";
  log(`git init`);
  say(`빈 폴더가 <b>저장소</b>가 되었습니다. 그런데 <b>노선도는 아직 비어 있습니다</b> — <code>main</code>이라는 <b>이름만 정해졌을 뿐</b> 역이 하나도 없어서 이름표를 붙일 곳도 없습니다. 브랜치는 <b>역을 가리키는 이름표</b>라서, 가리킬 역이 없으면 그림에도 나타나지 않습니다.`);
  render();
}
function cmdAdd(){
  const msg = ($("msg").value || "").trim();
  if(S.staged) return say(`이미 <b>${esc(S.staged)}</b> 이(가) 담겨 있습니다. <b>커밋</b>으로 저장하세요.`);
  if(!msg) return say("담을 변경이 없습니다. 무엇을 했는지 먼저 적으세요.");
  snap();
  doStage(msg);
  $("msg").value = "";
  say(`<b>${esc(msg)}</b> 을(를) 담았습니다. 아직 저장된 건 아닙니다 — <b>커밋</b>을 눌러야 역이 생깁니다.`);
  render();
}
// auto=true면 담기까지 한 번에 한다 (시나리오·자동 안내용)
function cmdCommit(msg, auto){
  // 저장소가 없으면 담을 곳도 커밋할 곳도 없다 (git init / clone 전)
  if(!S.head) return say("아직 저장소가 없습니다. 먼저 <code>git init</code>으로 저장소를 만드세요.");
  if(!S.staged){
    if(!auto){
      const typed = ($("msg").value || "").trim();
      if(typed) log(`git commit -m "${typed}"   # nothing added`, "e");
      say(`담긴 변경이 없어 커밋할 게 없습니다. 먼저 <b>담기 · add</b>를 누르세요. 실제 git도 <code>no changes added to commit</code>이라고 답합니다.`);
      render();          // 거절 줄도 로그에 바로 보여야 한다 (cmdPush·cmdSwitch의 거절과 같은 처리)
      return;
    }
    snap();
    doStage((msg || "").trim() || "작업 내용 저장");
  } else snap();
  msg = S.staged;
  S.staged = null;
  const id = doCommit(msg);
  log(`git commit -m "${msg}"`);
  say(`<b>${esc(S.head)}</b> 노선 끝에 역 <code>${id}</code> 이(가) 새로 생겼습니다. 담겼던 변경이 저장되고 HEAD도 함께 앞으로 이동합니다.`);
  render();
}
function cmdBranch(name){
  if(!name) return say("브랜치 이름을 입력하세요.");
  if(/[\s~^:?*\[\\]/.test(name) || name.includes("..") || /^[-\/.]|[\/.]$/.test(name))
    return say("브랜치 이름에 공백이나 <code>~ ^ : ? * [ \\ ..</code> 는 쓸 수 없습니다. 실제 git도 거절합니다.");
  if(S.branches[name]) return say(`<b>${esc(name)}</b> 브랜치는 이미 있습니다.`);
  snap();
  const base = cur().head;
  makeBranch(name);
  S.branches[name].head = base;
  S.head = name;
  log(`git switch -c ${name}`);
  say(`<b>${esc(name)}</b> 노선이 <code>${base}</code> 역에서 갈라졌습니다. 아직 역은 없고 출발점만 공유합니다.`);
  render();
}
function cmdSwitch(name){
  if(name===S.head) return say(`이미 <b>${esc(name)}</b> 노선에 있습니다.`);
  // 내 컴퓨터엔 없고 서버에만 있는 노선. git이 원격을 따라가는 로컬 노선을 알아서 만들어 준다
  // (clone 직후 origin/develop은 보이는데 develop이 없어 당황하는 지점)
  if(!S.branches[name]){
    const r = remoteOf(name);
    // 서버에도 없는 이름이면 만들어 주지 않는다. 실제 git도 거절한다
    if(!r){
      log(`git switch ${name}   # invalid reference`, "e");
      say(`<b>${esc(name)}</b>은(는) 내 컴퓨터에도 서버에도 없습니다. 실제 git도 <code>fatal: invalid reference</code>라며 <b>거절</b>합니다 — <code>git switch</code>는 <b>브랜치를 만드는 명령이 아닙니다</b>. 새로 만들려면 <b>브랜치 + 이동</b>(<code>git switch -c</code>)을 쓰세요.`);
      render(); return;
    }
    snap();
    // 원격과 같은 lane·색을 물려받아 같은 줄에 놓인다. laneNext는 건드리지 않는다
    S.branches[name] = { name, head:r.known, lane:r.lane, color:r.color };
    S.head = name;
    log(`git switch ${name}`);
    say(`내 컴퓨터에 <b>${esc(name)}</b>이(가) 없었는데도 이동했습니다. 서버에 <code>${esc(r.name)}</code>이(가) <b>있을 때만</b> git이 그걸 따라가는 로컬 노선을 자동으로 만들어 줍니다. 서버에도 없는 이름이면 <b>거절</b>합니다 — <code>git switch</code>는 브랜치를 <b>만드는</b> 명령이 아닙니다. 새로 만들 때는 <code>-c</code>를 붙입니다(<b>브랜치 + 이동</b> 버튼).`);
    render();
    return;
  }
  snap();
  S.head = name;
  log(`git switch ${name}`);
  say(`HEAD가 <b>${esc(name)}</b> 노선으로 옮겨졌습니다. 이제 커밋하면 이 노선 끝에 붙습니다.`);
  render();
}
function cmdMerge(name){
  const t = S.branches[name], c = cur();
  if(!t || name===S.head) return say("현재 브랜치와 다른 브랜치를 골라주세요.");
  if(!t.head) return say(`<b>${esc(name)}</b>에는 커밋이 없습니다.`);
  if(isAncestor(t.head, c.head)) { log(`git merge ${name}`); say(`이미 <b>${esc(name)}</b>의 내용을 전부 갖고 있어서 아무 일도 일어나지 않습니다. (Already up to date)`); return; }
  snap();
  if(isAncestor(c.head, t.head)){
    c.head = t.head;
    log(`git merge ${name}   # fast-forward`);
    say(`<b>${esc(S.head)}</b>가 갈라진 뒤 한 번도 커밋하지 않았기 때문에, 새 역을 만들지 않고 <b>${esc(name)}</b> 끝까지 그냥 미끄러져 갑니다. 이걸 <code>fast-forward</code>라고 합니다.`);
  } else {
    const id = hash();
    S.commits[id] = { id, parents:[c.head, t.head], lane:c.lane, msg:`Merge ${name}`, color:c.color, merge:true };
    S.order.push(id); c.head = id;
    log(`git merge ${name}`);
    say(`양쪽 모두 새 역이 있어서 <b>환승역</b> <code>${id}</code> 이(가) 만들어졌습니다. 부모가 둘인 유일한 커밋이며, 갈라졌던 기록이 그대로 남습니다.`);
  }
  render();
}
function cmdRebase(name){
  const t = S.branches[name], c = cur();
  if(!t || name===S.head) return say("현재 브랜치와 다른 브랜치를 골라주세요.");
  if(!t.head) return say(`<b>${esc(name)}</b>에는 커밋이 없습니다.`);
  if(isAncestor(t.head, c.head)) return say(`이미 <b>${esc(name)}</b> 위에 얹혀 있어서 옮길 게 없습니다.`);
  const base = ancestors(t.head), mine = ancestors(c.head);
  const only = S.order.filter(id => mine.has(id) && !base.has(id));
  // 실제 git rebase는 병합 커밋을 다시 붙이지 않고 흘려보낸다(--rebase-merges 없을 때).
  const replay = only.filter(id => !S.commits[id].merge);
  const dropped = only.length - replay.length;
  if(!replay.length){
    snap(); c.head = t.head; log(`git rebase ${name}`);
    say(dropped
      ? `옮길 일반 커밋이 없습니다. 병합 커밋 ${dropped}개는 rebase가 <b>다시 붙이지 않고 버립니다</b>. 위치만 이동했습니다.`
      : "옮길 커밋이 없어 위치만 이동했습니다.");
    render(); return;
  }
  snap();
  // 이번에 버려지는 역들은 새 줄로 옮긴다. 안 그러면 앞선 rebase의 유령과
  // 같은 lane·같은 칸에 놓여 서로 가린다 (rebase를 두 번 하면 바로 겹쳤다)
  const ghostLane = S.laneNext++;
  only.forEach(id => { S.commits[id].lane = ghostLane; });
  let parent = t.head; const made = [];
  replay.forEach(old=>{
    const id = hash();
    S.commits[id] = { id, parents:[parent], lane:c.lane, msg:S.commits[old].msg, color:c.color, from:old };
    S.order.push(id); parent = id; made.push(id);
  });
  c.head = parent;
  log(`git rebase ${name}`);
  say(`내 커밋 ${replay.length}개를 <b>${esc(name)}</b> 끝에 <b>복사</b>해 다시 붙였습니다. 해시가 <code>${replay[0]}</code> → <code>${made[0]}</code> 로 바뀐 점을 보세요. 원래 역들은 점선으로 남아 곧 사라집니다.`
    + (dropped ? ` 병합 커밋 ${dropped}개는 <b>따라오지 않습니다</b> — rebase는 갈라졌던 기록을 한 줄로 펴기 때문에 환승역이 사라집니다.` : ""));
  render();
}
/* ── 원격 저장소 ── */
// 주소가 등록돼 있는지만 본다(= .git/config). 서버에 무엇이 올라가 있는지는 각 명령이 따로 판정한다
function remoteGuard(){
  if(!S.origin){ say("이 저장소에는 아직 원격(<code>origin</code>)이 등록되어 있지 않습니다."); return false; }
  return true;
}
// git remote add — 주소에 origin이라는 이름을 붙여 둘 뿐이다. 네트워크를 쓰지 않는다.
// 그래서 서버 구역은 열리지만 안은 비어 있다 — origin/main 이름표는 push·fetch가 만든다
function cmdRemoteAdd(){
  if(!S.head) return say("아직 저장소가 없습니다. 먼저 <code>git init</code>으로 저장소를 만드세요.");
  if(S.origin) return say("이미 <code>origin</code>이 등록되어 있습니다.");
  snap();
  S.origin = ORIGIN_URL;
  log(`git remote add origin ${ORIGIN_URL}`);
  say(`아래에 <b>팀 공용 서버</b> 구역이 열렸지만 <b>안은 비어 있습니다</b>. <code>git remote add</code>는 그 주소에 <code>origin</code>이라는 <b>이름을 붙여 둘 뿐</b>이라 서버와 아무것도 주고받지 않습니다 — 인터넷이 끊겨 있어도, 주소가 틀려도 성공합니다. 서버에 실제로 말을 거는 건 다음 <code>push</code>입니다.`);
  render();
}
// clone — 서버 저장소를 통째로 내 컴퓨터로 복사한다. 로컬에는 기본 브랜치 하나만 생긴다
function cmdClone(){
  if(S.head) return say("이미 내 컴퓨터에 저장소가 있습니다.");
  const rm = S.branches[REMOTE];
  if(!rm) return say("받아올 서버 저장소가 없습니다.");
  snap();
  // 원격 main과 같은 lane·색을 물려받는다 (fresh에서 원격을 만들 때와 같은 규칙)
  S.branches.main = { name:"main", head:rm.head, lane:rm.lane, color:rm.color };
  remotes().forEach(r => { r.known = r.head; });   // clone은 서버에 있는 것을 전부 받아온다
  S.head = "main";
  log(`git clone ${ORIGIN_URL}`);
  say(`서버 저장소를 <b>통째로</b> 내 컴퓨터로 복사했습니다. 파선이던 역이 <b>전부 진해졌습니다</b> — 주황 노선의 역까지 하나도 빠짐없이 왔습니다. 그런데 <b>내 이름표가 붙은 노선은 <code>main</code> 하나뿐</b>입니다. <b>커밋은 다 왔는데 브랜치는 안 따라왔습니다</b> — 다음 단계에서 확인해 보겠습니다.`);
  render();
}
// 상태를 바꾸지 않는 조회 명령. 서버에만 있는 노선을 눈으로 확인시킨다
function cmdBranchList(){
  const local = Object.keys(S.branches).filter(n => !S.branches[n].remote);
  const only = remotes().filter(r => !local.includes(r.name.slice(RPFX.length)));
  snap();
  log(`git branch -a`);
  // 조회 명령은 그림을 바꾸지 않는다. 대신 터미널이 뿌리는 목록을 그대로 보여준다
  local.forEach(n => log(`${n === S.head ? "* " : "  "}${n}`, "o"));
  remotes().forEach(r => log(`  remotes/${r.name}`, "o"));
  say(only.length
    ? `<b>그림은 그대로입니다</b> — 조회만 하는 명령이라 저장소를 바꾸지 않습니다. 대신 아래 <b>실행한 명령</b> 칸에 목록이 찍혔습니다. 내 노선은 <code>${esc(local.join(", "))}</code> 뿐인데 서버에는 <code>${esc(only.map(r=>r.name).join(", "))}</code>도 있죠 — <b>clone해도 로컬 노선은 기본 브랜치 하나만</b> 생깁니다.`
    : `<b>그림은 그대로입니다</b> — 조회만 하는 명령이라 저장소를 바꾸지 않습니다. 내 노선은 <code>${esc(local.join(", "))}</code>이고 서버에만 있는 노선은 없습니다.`);
  render();
}
function cmdTeamCommit(msg){
  if(!remoteGuard()) return;
  // 주소만 등록하고 아직 아무것도 안 올린 상태에서는 팀원이 올릴 곳도 없다
  if(!S.branches[REMOTE]) return say("서버에 아직 <code>main</code>이 없습니다. 먼저 <b>올리기</b>로 올려 두세요.");
  msg = (msg || "").trim() || "팀원 작업";
  snap();
  // 원격 이름표 위치에서 커밋한 것처럼 처리한다. 내 브랜치는 움직이지 않는다
  const back = S.head; S.head = REMOTE;
  const id = doCommit(msg);
  S.head = back;
  log(`# 팀원이 원격에 "${msg}" 커밋을 올렸습니다`, "n");
  say(`서버에 역 <code>${id}</code> 이(가) 생겼습니다. 아직 <b>가져오지 않아</b> 흐리게 그려집니다 — <code>${REMOTE}</code> 이름표도 <b>${esc(back)}</b>도 제자리입니다.`);
  render();
}
// fetch: 서버 상태를 내려받기만 한다. 내 브랜치는 건드리지 않는다. 원격 전체가 대상
function cmdFetch(){
  if(!remoteGuard()) return;
  const behind = remotes().filter(r => r.known !== r.head);
  if(!behind.length){ log(`git fetch`); say("서버에 새 역이 없습니다. 가져올 것이 없습니다."); return; }
  snap();
  behind.forEach(r => { r.known = r.head; });
  log(`git fetch`);
  say(`서버의 새 역을 <b>내려받았습니다</b>. <code>${esc(behind.map(r=>r.name).join(", "))}</code> 이름표가 따라왔지만 내 브랜치는 <b>제자리</b>입니다 — <code>fetch</code>는 가져오기만 하고 <b>합치지 않습니다</b>.`);
  render();
}
// PR 열기 — 저장소를 전혀 바꾸지 않는다. GitHub 웹에 "합쳐 주세요"라는 요청 글이 생길 뿐이다.
// 그림이 안 변하는 것 자체가 요점이라 상태는 건드리지 않고 로그와 설명만 남긴다
// (cmdBranchList의 "그림은 그대로입니다"와 같은 처리)
function cmdPROpen(name){
  if(!remoteGuard()) return;
  if(!remoteOf(name)) return say(`<b>${esc(name)}</b>는 아직 서버에 없습니다. 먼저 <b>올리기</b>로 올려 두세요.`);
  snap();
  log(`# GitHub 웹에서 Pull Request를 열었습니다 (${name} → main)`, "n");
  say(`<p><b><code>push</code>가 PR을 만든 게 아닙니다.</b> <code>git push</code>는 브랜치를 서버에 <b>올리기만</b> 합니다. 애초에 <b>PR은 git 기능이 아니라 GitHub 기능</b>이라 <code>git pull-request</code> 같은 명령 자체가 없습니다 — <b>방금 push한 내가 브라우저에서 직접</b> 만듭니다. 새 브랜치가 올라오면 GitHub이 저장소 페이지에 만들기 버튼을 띄워 주는데, 그건 <b>양식으로 가는 지름길일 뿐 아직 PR이 아닙니다.</b> 눌러서 <b>무엇을(<code>${esc(name)}</code>) 어디로(<code>main</code>)</b> 합칠지 고르고 제목을 적어 제출해야 그때 생깁니다.</p>`
    + `<p>그래도 <b><code>push</code>는 전제입니다</b> — 서버에 <code>${esc(RPFX + name)}</code>이(가) 있어야 합쳐 달라고 가리킬 수 있으니까요. <b>내 컴퓨터에만 있는 브랜치로는 PR을 열 수 없습니다.</b></p>`
    + `<p>그런데 <b>노선도는 하나도 안 변했습니다.</b> PR은 합치는 명령이 아니라 <b>요청 글</b>이니까요. 리뷰도 코멘트도 저장소를 안 바꿉니다. 실제로 바뀌는 건 <b>Merge 버튼을 누른 다음</b>입니다.</p>`);
  render();
}
// PR 병합 — 합치는 일이 내 컴퓨터가 아니라 서버에서 일어난다.
// 로컬 브랜치도 HEAD도 움직이지 않고, 결과는 fetch/pull로 받아와야 한다
// 서버에 있고 아직 origin/main에 안 들어간 기능 브랜치들
function prSources(){
  const rm = remoteOf("main");
  return rm ? remotes().filter(r => r !== rm && !isAncestor(r.head, rm.head)) : [];
}
function cmdPR(name){
  if(!remoteGuard()) return;
  const rm = remoteOf("main");
  if(!rm) return say("서버에 <code>main</code>이 없습니다.");
  if(!remotes().some(r => r !== rm))
    return say("서버에 올라간 기능 브랜치가 없습니다. 기능 브랜치에서 <b>올리기</b>를 먼저 하세요.");
  const open = prSources();
  if(!open.length) return say("서버의 기능 브랜치가 이미 <code>origin/main</code>에 합쳐져 있습니다.");
  // 고른 브랜치가 있으면 그것, 없으면 남은 것 중 첫 번째
  const src = (name && open.find(r => r.name === RPFX + name)) || open[0];
  if(name && !open.find(r => r.name === RPFX + name))
    return say(`<b>${esc(name)}</b>은(는) 이미 합쳐졌거나 서버에 없습니다.`);
  snap();
  const id = hash();
  S.commits[id] = { id, parents:[rm.head, src.head], lane:rm.lane,
                    msg:`Merge ${src.name.slice(RPFX.length)}`, color:rm.color, merge:true };
  S.order.push(id);
  rm.head = id;                       // 서버만 앞으로 간다. known은 그대로 = 아직 안 받은 상태
  log(`# GitHub 웹에서 Pull Request를 병합했습니다 (${src.name.slice(RPFX.length)} → main)`, "n");
  say(`<b>서버에서</b> 병합이 일어났습니다. 환승역 <code>${id}</code> 은(는) 서버 띠 쪽에 생겼고 <b>내 컴퓨터에는 아직 없습니다</b> — <code>origin/main</code> 이름표도 제자리입니다. <b>가져오기</b>나 <b>받아오기</b>로 가져와야 합니다.`);
  render();
}
function cmdPull(){
  if(!remoteGuard()) return;
  const c = cur(), r = remoteOf(c.name);
  if(!r){ say(`<b>${esc(c.name)}</b>는 아직 서버에 없습니다. 먼저 <b>올리기</b>로 올려 두세요.`); return; }
  if(r.head === c.head) { r.known = r.head; log(`git pull`); say("이미 원격과 같은 위치입니다. (Already up to date)"); render(); return; }
  if(isAncestor(r.head, c.head)) { log(`git pull`); say("원격에 새 역이 없습니다. 내 쪽이 앞서 있으니 <b>올리기</b>를 쓰세요."); return; }
  snap();
  r.known = r.head;                       // pull = fetch + merge. 앞의 fetch 부분
  if(isAncestor(c.head, r.head)){
    c.head = r.head; c.lane = S.commits[r.head].lane;
    log(`git pull   # fast-forward`);
    say(`받아온 커밋을 <b>${esc(c.name)}</b> 끝에 이어 붙일 것도 없이 <b>그냥 미끄러져</b> 따라붙었습니다. <code>fast-forward</code>입니다.`);
  } else {
    const id = hash();
    S.commits[id] = { id, parents:[c.head, r.head], lane:c.lane, msg:`Merge ${r.name}`, color:c.color, merge:true };
    S.order.push(id); c.head = id;
    log(`git pull   # merge`);
    say(`내 <b>${esc(c.name)}</b>과(와) 원격이 <b>서로 다르게</b> 뻗어 있어서 <b>환승역</b>이 생겼습니다. <code>git pull</code>은 <code>git fetch</code> + <code>git merge</code>입니다.`);
  }
  render();
}
function cmdPush(){
  if(!remoteGuard()) return;
  const c = cur(), r = remoteOf(c.name);
  // 서버에 아직 없는 브랜치는 이번 push로 처음 생긴다 (git push -u)
  if(!r){
    snap();
    S.branches[RPFX + c.name] = { name:RPFX + c.name, head:c.head, known:c.head,
                                  lane:c.lane, color:c.color, remote:true };
    log(`git push -u origin ${c.name}`);
    say(`<b>${esc(c.name)}</b> 노선이 서버에 <b>처음</b> 올라갔습니다. 서버 띠에 <code>${esc(RPFX + c.name)}</code> 이름표가 새로 생겼습니다 — 이제 팀원도 이 노선을 받아갈 수 있습니다.`);
    render(); return;
  }
  if(r.head === c.head) { log(`git push`); say("원격과 같은 위치라 올릴 것이 없습니다."); return; }
  if(!isAncestor(r.head, c.head)){
    log(`git push   # rejected (non-fast-forward)`, "e");
    say(`원격에 <b>내가 모르는 커밋</b>이 있어서 거절됩니다. 먼저 <b>받아오기</b>로 합친 뒤 다시 올리세요.`);
    render(); return;
  }
  snap();
  r.head = c.head; r.known = c.head; r.lane = c.lane;   // 올린 내용은 자동으로 아는 상태가 된다
  log(`git push`);
  say(`내 커밋을 원격에 올렸습니다. <code>${esc(r.name)}</code> 이름표가 <b>${esc(c.name)}</b>과(와) 같은 역으로 따라왔습니다.`);
  render();
}

function cmdUndo(){
  if(!undoStack.length) return say("되돌릴 단계가 없습니다.");
  S = undoStack.pop();
  say("한 단계 되돌렸습니다.");
  render();
}

// k: 없으면 실행한 명령, "e" 거절/오류, "n" 명령이 아닌 설명 줄, "o" 명령이 뿌린 출력
function log(t, k){ S.log.push({t, k}); }
function say(html){ $("note").innerHTML = html; }

/* ───────── 그리기 ───────── */
function render(){
  const reach = new Set();
  Object.values(S.branches).forEach(b => ancestors(b.head).forEach(x=>reach.add(x)));

  const depth = {};
  S.order.forEach(id=>{
    const p = S.commits[id].parents;
    depth[id] = p.length ? Math.max(...p.map(x=>depth[x]??0)) + 1 : 0;
  });

  // 서버에는 있지만 아직 fetch하지 않은 역. 줄 배치보다 먼저 알아야 해서 여기서 구한다
  // 내 저장소 자체가 없으면(clone 전) 받은 것도 없다 — 서버 커밋 전부가 "아직 안 받은 역"이다.
  // known을 비우는 방법도 있지만 그러면 서버 띠 이름표가 통째로 사라진다(rlabels가 known에 붙는다)
  const gotten = new Set();
  if(S.head) Object.values(S.branches).forEach(b=>{
    ancestors(b.remote ? b.known : b.head).forEach(x=>gotten.add(x));
  });
  const unfetched = id => !gotten.has(id);

  // 가로줄 배치: 세 종류를 위에서부터 L → G → R 순으로 쌓는다
  //   L 내 컴퓨터에 있는 역 / G rebase 후 버려진 역 / R 서버에만 있고 아직 안 받은 역
  // R을 맨 아래로 몰아야 "내 컴퓨터" 머리글 아래에 서버 것이 섞이지 않는다.
  // (버려진 역은 로컬에서 생긴 것이므로 R보다 위, 즉 내 컴퓨터 구역에 남는다)
  const ROW_ORD = { L:0, G:1, R:2 };
  const rowKind = id => !reach.has(id) ? "G" : (unfetched(id) ? "R" : "L");
  const rowKey = id => rowKind(id) + S.commits[id].lane;
  const rows = [];
  S.order.forEach(id=>{ const k = rowKey(id); if(!rows.includes(k)) rows.push(k); });
  rows.sort((a,b)=> ROW_ORD[a[0]] - ROW_ORD[b[0]] || (+a.slice(1)) - (+b.slice(1)));
  const rowOf = {}; rows.forEach((k,i)=>rowOf[k]=i);
  const rowIdx = id => rowOf[rowKey(id)];
  // 서버 구역이 시작되는 줄. 이 줄 위가 "내 컴퓨터"와 "팀 공용 서버"의 경계다
  const firstRemoteRow = rows.findIndex(k => k[0] === "R");
  const hasRemoteRows = firstRemoteRow >= 0;

  // 커밋별 브랜치 이름표 묶음 (HEAD → 이름표 → 커밋 3단 구조에 쓰인다)
  // 원격 이름표는 아래 서버 띠에 따로 모은다. 커밋(역)은 한 번만 그린다
  const labels = {}, rlabels = {};
  Object.values(S.branches).forEach(b=>{
    // 원격 이름표는 서버의 실제 위치(head)가 아니라 내가 아는 위치(known)에 붙는다
    const at = b.remote ? b.known : b.head;
    if(!at) return;
    const bag = b.remote ? rlabels : labels;
    (bag[at] = bag[at] || []).push(b);
  });
  // 주소만 등록해 둔 상태(git remote add 직후)에도 구역은 연다. 대신 안이 비어 있다는 걸 보여준다
  const emptyBand = !Object.keys(rlabels).length && !!S.origin;
  const hasBand = Object.keys(rlabels).length > 0 || emptyBand;

  // 이름표 알약 너비. 글자 수로 어림잡으면 한글이 알약을 넘는다(10자부터 넘쳤다).
  // Pretendard는 고정폭이 아니므로 실제 그려질 폭을 재서 쓴다
  const lblW = b => textW(b.name, b.name===S.head ? 800 : 600) + 20;
  const lblExt = b => lblW(b) + (b.name===S.head ? 64 : 8);       // HEAD 뱃지까지 포함한 오른쪽 끝
  const lblRight = list => 26 + Math.max(...list.map(lblExt));
  const stackMax = Math.max(1, ...Object.values(labels).map(l=>l.length));
  const ROW_H = Math.max(ROW_H0, (stackMax-1)*LBL_GAP + 68);      // 이름표가 아래 lane 글자와 겹치지 않게

  // 열 간격: 이름표 오른쪽에 같은 줄의 다음 역이 오면 그만큼 벌린다
  const maxDepth = Math.max(0, ...Object.values(depth));
  // 부모-자식 여부와 상관없이, 같은 줄 다음 칸에 역이 있으면 그만큼 벌린다
  const taken = new Set(S.order.map(id => rowIdx(id)+":"+depth[id]));
  const gapAt = [];
  Object.keys(labels).forEach(cid=>{
    if(!taken.has(rowIdx(cid)+":"+(depth[cid]+1))) return;
    const d = depth[cid];
    gapAt[d] = Math.max(gapAt[d]||0, lblRight(labels[cid]) + 37);
  });
  // 서버 띠 이름표는 역 아래 가운데 정렬로 묶여 놓인다. 이웃 열의 묶음과 겹치지 않게 벌린다
  const bandW = list => list.reduce((s,b)=>s+lblW(b),0) + (list.length-1)*6;
  const bandAt = [];
  Object.keys(rlabels).forEach(cid=>{
    const d = depth[cid];
    bandAt[d] = Math.max(bandAt[d]||0, bandW(rlabels[cid]));
  });
  for(let d=0; d<maxDepth; d++){
    if(bandAt[d] && bandAt[d+1])
      gapAt[d] = Math.max(gapAt[d]||0, bandAt[d]/2 + bandAt[d+1]/2 + 12);
  }
  const colX = []; let colCur = PAD_X;
  for(let d=0; d<=maxDepth; d++){ colX[d] = colCur; colCur += Math.max(COL_W, gapAt[d]||0); }

  // 왼쪽 끝 역의 서버 이름표 묶음이 x=0 밖으로 나가면 전체를 오른쪽으로 민다
  let shift = 0;
  Object.keys(rlabels).forEach(cid=>{
    shift = Math.max(shift, 10 - (colX[depth[cid]] - bandW(rlabels[cid])/2));
  });
  if(shift > 0) for(let d=0; d<colX.length; d++) colX[d] += shift;

  const topPad = PAD_Y + (hasBand ? BAND_CAP : 0);   // 위쪽 "내 컴퓨터" 머리글 자리
  // 서버 구역 줄은 통째로 내려 "팀 공용 서버" 머리글이 역 메시지를 덮지 않게 한다
  const R_CAP = 26;
  const pos = {};
  S.order.forEach(id=>{
    pos[id] = { x: colX[depth[id]],
                y: topPad + rowIdx(id)*ROW_H + (rowKind(id) === "R" ? R_CAP : 0) };
  });

  // 자리가 바뀐 역. pull로 받아와 서버 구역에서 올라오는 경우가 대표적이다
  const movedIds = new Set();
  S.order.forEach(id=>{
    const pv = prevPos.get(id), p = pos[id];
    if(pv && (Math.abs(pv.x - p.x) > 0.5 || Math.abs(pv.y - p.y) > 0.5)) movedIds.add(id);
  });

  let rightEnd = Math.max(...Object.values(pos).map(p=>p.x), PAD_X) + 60;
  Object.keys(labels).forEach(cid=>{ rightEnd = Math.max(rightEnd, pos[cid].x + lblRight(labels[cid])); });
  // 서버 띠의 이름표 묶음은 역 아래 가운데 정렬이라 오른쪽으로 묶음 폭의 절반만큼 나간다
  Object.keys(rlabels).forEach(cid=>{
    rightEnd = Math.max(rightEnd, pos[cid].x + bandW(rlabels[cid])/2 + 14);
  });
  // 띠 머리글이 잘리지 않게. 빈 띠는 안내 문구가 들어가므로 더 넓게 잡는다
  if(hasBand) rightEnd = Math.max(rightEnd, emptyBand ? 300 : 176);
  // 역이 하나도 없는 상태(빈 폴더 · git init 직후)는 텅 빈 화면이 고장으로 보인다. 한 줄 남긴다
  const emptyMsg = S.order.length ? null
    : (S.head ? "저장소는 생겼지만 아직 커밋이 없습니다" : "아직 저장소가 없습니다");
  const maxX = Math.max(rightEnd + 18, emptyMsg ? 340 : 0);
  // 로컬 구역의 아래끝. 서버 전용 줄(R)은 서버 구역이므로 여기서 뺀다
  const localRows = hasRemoteRows ? firstRemoteRow : rows.length;
  const bodyBottom = topPad + Math.max(0, localRows-1)*ROW_H
             + Math.max(64, (stackMax-1)*LBL_GAP + 32);
  // 서버 구역 경계. 서버 전용 줄이 있으면 그 줄 바로 위까지 올라온다.
  // 로컬이 통째로 비면(clone 전) 경계가 머리글까지 밀려 올라가므로 위쪽을 막아 둔다
  // 92 = 역 위 메시지·해시(53)와 머리글 자리(26)를 합쳐 띄우는 높이
  const firstRemoteY = topPad + Math.max(0, firstRemoteRow)*ROW_H + R_CAP;
  const bandTop = hasRemoteRows
    ? Math.max(24, firstRemoteY - 92)
    : bodyBottom + BAND_GAP;
  // 서버 이름표는 언제나 구역 맨 아래에 모인다
  const lastRowY = Math.max(topPad, ...Object.values(pos).map(p=>p.y));
  const bandY = hasRemoteRows ? lastRowY + 54 : bandTop + 38;   // 서버 이름표 세로 중심
  const maxY = hasBand ? (hasRemoteRows ? bandY + 24 : bandTop + BAND_H) : bodyBottom;
  const svg = $("canvas");
  svg.setAttribute("viewBox", `0 0 ${maxX} ${maxY}`);
  svg.setAttribute("width", maxX);
  svg.setAttribute("height", maxY);
  svg.innerHTML = "";

  const NS = "http://www.w3.org/2000/svg";
  const el = (t,a)=>{ const n=document.createElementNS(NS,t); for(const k in a) n.setAttribute(k,a[k]); return n; };

  if(emptyMsg){
    const t = el("text",{ x:maxX/2, y:topPad, "text-anchor":"middle","font-size":13, fill:"#9AA6B4" });
    t.textContent = emptyMsg;
    svg.appendChild(t);
  }

  // 노선 이름표 (왼쪽 여백)
  rows.forEach((k,i)=>{
    const y = topPad + i*ROW_H;
    svg.appendChild(el("line",{x1:0,y1:y,x2:maxX,y2:y,stroke:"#E4E9EF","stroke-width":1}));
  });

  // 내 컴퓨터 / 팀 공용 서버 구역 나누기. 머리글은 스크롤과 무관하게 HTML로 얹는다
  // (구역 이름은 그림 밖에 있으므로 <desc>로도 알려 준다)
  const desc = el("desc",{});
  desc.textContent = hasBand
    ? "위쪽은 내 컴퓨터의 커밋과 브랜치, 아래 띠는 팀 공용 서버(origin)의 위치입니다."
    : "커밋을 역, 브랜치를 노선으로 그린 그래프입니다.";
  svg.insertBefore(desc, svg.firstChild);

  $("zoneLocal").hidden = $("zoneRemote").hidden = !hasBand;
  if(hasBand){
    // .map 패딩값을 코드에 두 번 쓰지 않는다 (offsetTop은 HTML 요소인 스크롤 상자에서 읽는다)
    const svgTop = svg.parentNode.offsetTop;
    $("zoneLocal").style.top = (svgTop + 3) + "px";
    $("zoneRemote").style.top = (svgTop + bandTop + 7) + "px";
    // 서버 전용 역이 있으면 그 역들까지 구역 안에 들어와야 한다
    svg.appendChild(el("rect",{ x:0, y:bandTop, width:maxX, height:maxY - bandTop, fill:"#F1F5FA" }));
    svg.appendChild(el("line",{ x1:0, y1:bandTop, x2:maxX, y2:bandTop,
      stroke:REMOTE_COLOR, "stroke-width":1.5, "stroke-dasharray":"7 5", opacity:.5 }));
    // 주소만 등록된 상태. 구역은 열렸지만 올라간 것이 없다는 걸 글로 남긴다
    if(emptyBand){
      const t = el("text",{ x:maxX/2, y:bandTop + 42, "text-anchor":"middle","font-size":12.5,
        fill:REMOTE_COLOR, opacity:.75 });
      t.textContent = "주소만 등록했습니다 — 아직 주고받은 것이 없습니다";
      svg.appendChild(t);
    }
    // 서버 이름표가 어느 역을 가리키는지 잇는 세로 점선 (선로·역 아래로 깔린다)
    Object.keys(rlabels).forEach(cid=>{
      const p = pos[cid];
      svg.appendChild(el("line",{ x1:p.x, y1:p.y+18, x2:p.x, y2:bandY-12,
        stroke:REMOTE_COLOR, "stroke-width":2, "stroke-dasharray":"3 5", opacity:.45 }));
    });
  }

  // 선로
  S.order.forEach(id=>{
    const c = S.commits[id], live = reach.has(id);
    c.parents.forEach((pid,i)=>{
      const a = pos[pid], b = pos[id];
      if(!a) return;
      const d = (a.y===b.y)
        ? `M ${a.x} ${a.y} L ${b.x} ${b.y}`
        : `M ${a.x} ${a.y} C ${a.x+COL_W*0.55} ${a.y}, ${b.x-COL_W*0.55} ${b.y}, ${b.x} ${b.y}`;
      const key = pid+">"+id, soft = live && unfetched(id);   // 아직 안 받은 구간
      const path = el("path",{
        d, fill:"none",
        stroke: !live ? "#AEB8C4" : (soft ? REMOTE_COLOR : (i===1 ? S.commits[pid].color : c.color)),
        "stroke-width": !live ? 3 : (soft ? 5 : 7),
        "stroke-linecap":"round",
        opacity: live ? (soft ? .7 : 1) : .4,
        // 버려진 선로는 점, 아직 안 받은 선로는 파선 — 색만으로 구분하면 헷갈린다
        "stroke-dasharray": !live ? "0.1 7" : (soft ? "7 5" : "none")
      });
      if(live && !soft && !seenEdges.has(key)){
        const L = 400;
        path.classList.add("edge-enter");
        path.style.setProperty("--len", L);
        path.style.strokeDasharray = L;
        path.addEventListener("animationend", ()=>{ path.style.strokeDasharray = "none"; });
      } else if(movedIds.has(id) || movedIds.has(pid)){
        path.classList.add("edge-fade");   // 양 끝이 움직이는 동안 새 자리에서 떠오른다
      }
      seenEdges.add(key);
      svg.appendChild(path);
    });
  });

  // 역
  S.order.forEach(id=>{
    const c = S.commits[id], p = pos[id], live = reach.has(id), soft = live && unfetched(id);
    const g = el("g",{ transform:`translate(${p.x},${p.y})` });
    const gi = el("g",{ style:"transform-box:fill-box;transform-origin:center" });
    if(live && !soft && !seenNodes.has(id)) gi.classList.add("enter");
    seenNodes.add(id);
    g.appendChild(gi);
    // 자리가 바뀐 역은 이전 자리에 놓고 다음 프레임에 새 자리로 옮긴다.
    // CSS transform이 SVG transform 속성을 대신하므로 애니메이션이 끝나도 자리가 유지된다
    if(movedIds.has(id)){
      const pv = prevPos.get(id);
      g.style.transform = `translate(${pv.x}px,${pv.y}px)`;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        g.classList.add("node-move");
        g.style.transform = `translate(${p.x}px,${p.y}px)`;
      }));
    }

    gi.appendChild(el("circle",{ r:15, fill:"#fff",
      stroke: !live ? "#AEB8C4" : (soft ? REMOTE_COLOR : c.color),
      "stroke-width": c.merge ? 4 : 5,
      opacity: !live ? .45 : (soft ? .8 : 1),
      // 버려진 역은 점 동그라미, 아직 안 받은 역은 파선 동그라미
      "stroke-linecap": live ? "butt" : "round",
      "stroke-dasharray": !live ? "0.1 5" : (soft ? "7 5" : "none") }));
    // 가운데 점도 바깥 원과 같은 상태로 그린다 (안 그러면 흐린 역인데 점만 원색으로 남는다)
    if(c.merge) gi.appendChild(el("circle",{ r:7,
      fill: !live ? "#AEB8C4" : (soft ? REMOTE_COLOR : c.color),
      opacity: !live ? .45 : (soft ? .8 : 1) }));

    const h = el("text",{ y:-24, "text-anchor":"middle",
      "font-family":"ui-monospace,Consolas,monospace","font-size":11,"font-weight":700,
      fill: !live ? "#AEB8C4" : (soft ? REMOTE_COLOR : "#141C26"),
      opacity: soft ? .9 : 1 });
    h.textContent = id;
    g.appendChild(h);

    const m = el("text",{ y:-42, "text-anchor":"middle","font-size":11.5,
      opacity: soft ? .9 : 1,
      fill: live ? "#5B6876" : "#BAC3CD" });
    m.textContent = c.msg.length>13 ? c.msg.slice(0,12)+"…" : c.msg;
    g.appendChild(m);
    svg.appendChild(g);
  });

  // 브랜치 이름표 + HEAD  (HEAD → 브랜치 이름표 → 커밋)
  Object.keys(labels).forEach(cid=>{
    const list = labels[cid], p = pos[cid];
    const g = el("g",{ transform:`translate(${p.x},${p.y})` });
    if(list.length>1)
      g.appendChild(el("line",{ x1:20, y1:0, x2:20, y2:(list.length-1)*LBL_GAP,
        stroke:"#C4CDD8","stroke-width":2 }));
    list.forEach((b,i)=>{
      const y = i*LBL_GAP, w = lblW(b), on = b.name===S.head;
      // 이름표 → 커밋 연결선
      g.appendChild(el("line",{ x1:i?20:15, y1:y, x2:26, y2:y, stroke:"#C4CDD8","stroke-width":2 }));
      // 선로 위에 얹혀도 읽히도록 흰 바탕을 깐다
      g.appendChild(el("rect",{ x:23, y:y-13, width:w+6, height:26, rx:13, fill:"#fff" }));
      // 원격 이름표는 여기 오지 않는다 (아래 서버 띠에서 따로 그린다)
      const gb = el("g",{ opacity: on ? 1 : .5 });
      gb.appendChild(el("rect",{ x:26, y:y-10, width:w, height:20, rx:10,
        fill: b.color, stroke: on ? "#141C26" : "none", "stroke-width": on ? 2.5 : 0 }));
      const t = el("text",{ x:26+w/2, y:y+4, "text-anchor":"middle","font-size":11.5,
        "font-weight": on ? 800 : 600, fill:"#fff" });
      t.textContent = b.name;
      gb.appendChild(t);
      g.appendChild(gb);
      if(!on) return;
      // HEAD 뱃지 → 현재 이름표를 가리키는 화살표
      const hx = 26 + w;
      g.appendChild(el("line",{ x1:hx+9, y1:y, x2:hx+16, y2:y, stroke:"var(--head)","stroke-width":2.5 }));
      g.appendChild(el("path",{ d:`M ${hx+2} ${y} L ${hx+11} ${y-5} L ${hx+11} ${y+5} Z`, fill:"var(--head)" }));
      g.appendChild(el("rect",{ x:hx+16, y:y-11, width:46, height:22, rx:11, fill:"var(--head)" }));
      const ht = el("text",{ x:hx+39, y:y+4, "text-anchor":"middle","font-size":11,"font-weight":800,
        fill:"#fff","font-family":"ui-monospace,Consolas,monospace" });
      ht.textContent = "HEAD";
      g.appendChild(ht);
    });
    svg.appendChild(g);
  });

  // 서버 띠 안의 원격 이름표 — 자기가 가리키는 역 바로 아래에 묶음째 가운데 정렬된다
  Object.keys(rlabels).forEach(cid=>{
    const px = pos[cid].x;
    let cx = px - bandW(rlabels[cid])/2;
    rlabels[cid].forEach(b=>{
      const w = lblW(b), x = cx; cx += w + 6;
      svg.appendChild(el("rect",{ x, y:bandY-10, width:w, height:20, rx:10,
        fill:"#fff", stroke:REMOTE_COLOR, "stroke-width":2 }));
      const t = el("text",{ x:x+w/2, y:bandY+4, "text-anchor":"middle","font-size":11.5,
        "font-weight":600, fill:REMOTE_COLOR });
      t.textContent = b.name;
      svg.appendChild(t);
    });
  });

  // 사이드 UI
  // clone 전에는 내 저장소 자체가 없어 HEAD도 없다
  $("nowBranch").textContent = S.head || "아직 없음";
  $("stagedBox").hidden = !S.staged;
  if(S.staged) $("stagedTxt").textContent = S.staged;
  // 커밋 버튼은 일부러 막지 않는다 — 담지 않고 눌러 거절당해 보는 게 이 모델의 핵심이다
  ["selSwitch","selMerge","selRebase"].forEach(k=>{
    const s = $(k), keep = s.value;
    s.innerHTML = "";
    Object.keys(S.branches).forEach(n=>{
      if(S.branches[n].remote) return;          // origin/main은 이동·병합 대상이 아니다
      if(k!=="selSwitch" && n===S.head) return;
      const o=document.createElement("option"); o.value=n; o.textContent=n; s.appendChild(o);
    });
    if([...s.options].some(o=>o.value===keep)) s.value = keep;
  });
  // PR 대상: 서버에 있고 아직 origin/main에 안 들어간 기능 브랜치만
  const sp = $("selPR"), keepPR = sp.value;
  sp.innerHTML = "";
  prSources().forEach(r=>{
    const n = r.name.slice(RPFX.length);
    const o = document.createElement("option"); o.value = n; o.textContent = n; sp.appendChild(o);
  });
  if([...sp.options].some(o=>o.value===keepPR)) sp.value = keepPR;

  // 저장소를 만들 때 한 번만 치는 명령. 이게 없으면 아래 기록을 그대로 옮겨 쳐도
  // 커밋할 저장소가 없고 push할 원격도 없다. 매번 하는 일이 아님을 형태로 보여준다
  // 최초 커밋과 upstream 설정까지 넣어야 아래 기록이 실제로 돌아간다.
  // 이게 없으면 첫 git push가 "no upstream branch"로 실패한다
  // clone 시나리오는 "이미 있는 저장소를 받아오는" 이야기라 git init 묶음이 맞지 않는다.
  // 거기서는 1단계의 git clone 자체가 처음 한 번만 하는 일이다.
  // commit·push 시나리오는 이 묶음의 줄을 직접 단계로 실행하므로 같은 줄을 위에 또 띄우지 않는다
  const SETUP = ["clone","commit","push"].includes(mode) ? "" : `<div class="setup"><span class="h"># 처음 한 번만 — 저장소를 만들 때</span>`
    + `$ git init\n$ git add .\n$ git commit -m "최초 커밋"\n`
    + `$ git remote add origin ${ORIGIN_URL}\n$ git push -u origin main</div>`;
  const lg = $("log");
  lg.innerHTML = SETUP + (S.log.length
    ? S.log.map(l=>`<div class="${l.k || "c"}">${esc(l.t)}</div>`).join("")
    : `<div class="empty">아직 실행한 명령이 없습니다.</div>`);
  lg.scrollTop = lg.scrollHeight;

  // 노선도 위 "방금 실행한 명령". "o"는 명령이 뿌린 출력이라 건너뛰고 그 앞 명령 줄을 잡는다
  const cc = $("curCmd");
  const last = [...S.log].reverse().find(l => l.k !== "o");
  cc.className = "cmdbar " + (last ? (last.k || "") : "empty");
  cc.textContent = last ? last.t : "명령을 실행하면 여기에 표시됩니다";

  const box = document.querySelector(".map-scroll");
  box.scrollLeft = box.scrollWidth;                 // 기본은 가장 최근 역
  const c0 = cur();                                 // clone 전에는 현재 브랜치가 없다
  const hx = c0 && c0.head ? pos[c0.head].x : null; // 좁은 화면에서 HEAD가 잘리면 그쪽으로
  if(hx !== null && hx < box.scrollLeft + 40) box.scrollLeft = Math.max(0, hx - 60);

  // 다음 render에서 "어디서 옮겨 왔는지" 알기 위해 이번 자리를 남긴다
  prevPos = new Map(S.order.map(id => [id, { x:pos[id].x, y:pos[id].y }]));
}

function drawSteps(){
  // cmd가 배열이면 한 단계가 여러 줄이다 (담기+저장은 한 번에 실행되므로 함께 체크된다).
  // 아래 "실행한 명령"과 줄이 1:1로 맞아야 옮겨 칠 때 헷갈리지 않는다
  $("stepList").innerHTML = scenario.steps.map((s,i)=>{
    const done = i < stepIdx, mark = done ? "✓" : "·";
    return (Array.isArray(s.cmd) ? s.cmd : [s.cmd])
      .map(c => `<div class="${done?"done":""}">${mark} <span class="cmd" style="display:inline">${c}</span></div>`)
      .join("");
  }).join("");
  $("btnNext").textContent = stepIdx >= scenario.steps.length ? "끝났습니다" : "다음 단계";
  $("btnNext").disabled = stepIdx >= scenario.steps.length;
  $("btnPrev").disabled = !stepStack.length;
}
function setMode(m){
  mode = m;
  // 시나리오 버튼은 묶음(.group) 안에 있어 직계 자식만 훑으면 놓친다
  $("modes").querySelectorAll("[data-mode]").forEach(b=> b.setAttribute("aria-pressed", b.dataset.mode===m));
  seenNodes = new Set(); seenEdges = new Set(); prevPos = new Map();
  stepStack = [];                                  // drawSteps보다 먼저 비워야 "이전"이 꺼진 채로 시작한다
  // clone 시나리오만 "내 컴퓨터가 빈 채로 서버에만 저장소가 있는" 상태에서 출발하고,
  // commit 시나리오는 서버도 저장소도 없는 빈 폴더에서 출발한다.
  // push 시나리오는 원격이 처음 등장하는 곳이라 원격 없이 시작해 remote add부터 직접 한다
  if(m === "clone") freshClone();
  else if(m === "commit") freshEmpty();
  else fresh(m === "free" || m === "pr");
  if(m==="free"){
    $("freePanel").style.display=""; $("stepPanel").style.display="none";
    say("브랜치를 만들고 커밋해보세요.");
  } else {
    $("freePanel").style.display="none"; $("stepPanel").style.display="";
    scenario = SCEN[m]; stepIdx = 0; drawSteps();
    // 시작 화면이 여느 시나리오와 다른 경우에만 따로 설명한다
    say(`<b>${scenario.title}</b> — ${scenario.intro || "아래 ‘다음 단계’를 눌러 한 줄씩 실행하세요."}`);
  }
  render();
}

// 설명 문구도 함께 담는다. 상태만 되돌리면 방금 단계의 설명이 남아 그림과 어긋난다
$("btnNext").onclick   = ()=>{
  if(stepIdx >= scenario.steps.length) return;
  stepStack.push({ s:clone(S), note:$("note").innerHTML, msg:$("msg").value });
  scenario.steps[stepIdx].run(); stepIdx++; drawSteps();
};
// 명령을 거꾸로 실행하지 않는다 — 상태를 통째로 되돌린다 (tourJump가 덧실행으로 겪은 함정)
$("btnPrev").onclick   = ()=>{
  const p = stepStack.pop();
  if(!p) return;
  S = p.s; $("note").innerHTML = p.note; $("msg").value = p.msg;
  stepIdx--;
  // 사라진 역·선로만 추적 집합에서 걷어낸다. 통째로 비우면 다시 앞으로 갈 때
  // 화면의 모든 역이 한꺼번에 등장 애니메이션을 다시 탄다
  seenNodes = new Set([...seenNodes].filter(id => S.commits[id]));
  seenEdges = new Set([...seenEdges].filter(k => S.commits[k.split(">")[1]]));
  prevPos = new Map();          // 없어진 역에서 날아오는 유령 이동 방지
  drawSteps(); render();
};

// 장 이름은 시작 단계에만 적고 나머지는 이어받는다 (단계를 넣고 빼도 경계가 안 어긋난다)
const TOUR_CH = TOUR.reduce((a,s,i)=>{ a[i] = s.ch || a[i-1] || ""; return a; }, []);

let tIdx = 0, tRaf = null, tPlaying = true, tEls = null, tActs = [];
const TOUR_DOCK = 20;        // 노선도 패널과 말풍선 사이 고정 여백
let tT0 = 0, tPauseAt = 0;   // 단계 시작 시각 / 일시정지한 시각
let tSnap = [];              // 단계 진입 시점의 노선도 상태
// 단계 동작(act)은 예약해두고 단계를 넘기거나 안내를 닫을 때 전부 취소한다.
// (예약된 커밋이 안내를 닫은 뒤에 실행되던 문제)
// 건너뛰는 중에는 예약을 기다리지 않고 바로 실행한다.
// 안 그러면 뒤이은 tClear에 지워져 그 단계의 두 번째 동작이 통째로 빠진다
let tJumping = false, tSpot = null, tBase = null;   // tSpot: 동작 뒤 함께 밝힐 대상 / tBase: 안내 시작 상태
// 구멍 두 개를 뚫으려면 clip-path: path()가 필요하다. 안 되면 예전 한 곳 방식으로 돈다
const CUTOUT_OK = typeof CSS !== "undefined" && CSS.supports && CSS.supports("clip-path", 'path("M0,0h1v1h-1z")');
const tLater = (fn, ms) => { if(tJumping) fn(); else tActs.push(setTimeout(fn, ms)); };
const tClear = () => { tActs.forEach(clearTimeout); tActs = []; };

// 안내 단계를 오갈 때 노선도도 같이 되감기 위한 스냅샷
// 입력칸도 함께 담는다. 안 그러면 되감은 뒤에도 뒤 단계가 넣은 글자가 남는다
const tourCapture = () => ({ s:clone(S), undo:clone(undoStack),
  nodes:[...seenNodes], edges:[...seenEdges], note:$("note").innerHTML,
  msg:$("msg").value, bname:$("bname").value });
function tourRestore(k){
  S = clone(k.s); undoStack = clone(k.undo);
  // 되감기는 이동 애니메이션 없이 그 자리에서 다시 그린다 (거꾸로 흐르면 어지럽다)
  seenNodes = new Set(k.nodes); seenEdges = new Set(k.edges); prevPos = new Map();
  $("note").innerHTML = k.note;
  if(k.msg   !== undefined) $("msg").value   = k.msg;
  if(k.bname !== undefined) $("bname").value = k.bname;
  render();
}

function tourBuild(){
  const mask = document.createElement("div"); mask.className="tour-mask";
  if(!CUTOUT_OK) mask.classList.add("solo");
  const hole = document.createElement("div"); hole.className="tour-hole";
  const hole2 = document.createElement("div"); hole2.className="tour-hole2";
  const tip  = document.createElement("div"); tip.className="tour-tip";
  tip.innerHTML = `
    <div class="meta"><span id="tCh"></span><span class="num" id="tNum"></span></div>
    <h3 id="tTitle"></h3>
    <p id="tBody"></p>
    <div class="tour-ctl">
      <button id="tPrev">이전</button>
      <button id="tPlay" class="pri">일시정지</button>
      <span class="sp"></span>
      <button id="tNext">다음</button>
      <button id="tEnd">닫기</button>
    </div>
    <div class="tour-bar" id="tBar"></div>`;
  document.body.append(mask, hole, hole2, tip);
  tEls = {mask, hole, hole2, tip};
  // 단계 하나당 칸 하나. 장이 바뀌는 칸 앞에는 틈을 준다
  $("tBar").innerHTML = TOUR.map((s,i)=>
    `<button class="seg${s.ch && i ? " br" : ""}" type="button" aria-label="${esc(TOUR_CH[i])} ${i+1}단계로 이동"
       title="${esc(TOUR_CH[i])} · ${i+1}단계"><i><b></b></i></button>`).join("");
  [...$("tBar").children].forEach((el,i)=>{ el.onclick = ()=>tourJump(i); });
  $("tPrev").onclick = ()=>tourGo(tIdx-1);
  $("tNext").onclick = ()=>tourGo(tIdx+1);
  $("tPlay").onclick = tourToggle;
  $("tEnd").onclick  = tourEnd;
  mask.onclick = e=>{ if(e.target===mask) tourToggle(); };
}

function tourStart(step){
  tourEnd();
  setMode("free");
  tourBuild();
  tIdx = 0; tPlaying = true; tSnap = [];
  tBase = tourCapture();            // 건너뛸 때 여기서 다시 재생한다
  document.body.classList.add("tour-on");
  window.addEventListener("resize", tourPlace);
  window.addEventListener("scroll", tourSync, { passive:true });
  if(step > 0) tourJump(step); else tourShow();
}

function tourGo(i){
  if(i < 0 || i >= TOUR.length){ if(i>=TOUR.length) tourEnd(); return; }
  tIdx = i; tourShow();
}

// 멀리 건너뛸 때는 지나친 단계의 동작을 한 번에 재생한다.
// 스냅샷도 같이 채워야 그 뒤에 '이전'으로 되감을 수 있다
function tourJump(n){
  n = Math.max(0, Math.min(TOUR.length-1, n));
  tClear(); cancelAnimationFrame(tRaf);
  // 반드시 시작 상태로 되돌린 뒤 재생한다. 현재 상태 위에 덧실행하면
  // 이미 만든 커밋에 같은 커밋이 또 붙는다 (막대로 앞 단계를 누를 때)
  if(tBase) tourRestore(tBase);
  tSnap = [];
  tJumping = true;
  try {
    for(let i=0; i<=n; i++){
      tSnap[i] = tourCapture();
      if(i < n && TOUR[i].act) TOUR[i].act();
    }
  } finally { tJumping = false; }
  tIdx = n; tourShow();
}

// 새로고침·쉬는 시간 복구용. localStorage를 못 쓰므로 주소에 남긴다
function tourHash(){
  const h = "#step=" + (tIdx+1);
  try { history.replaceState(null, "", h); } catch(e) { location.hash = h; }
}

function tourShow(){
  tClear(); cancelAnimationFrame(tRaf);
  tSpot = null;                      // 스포트라이트는 일단 이 단계가 가리키는 곳
  const s = TOUR[tIdx];
  // 이 단계에 처음 오면 상태를 저장하고, 다시 오면(특히 '이전') 그때 상태로 되돌린다
  if(tSnap[tIdx]) tourRestore(tSnap[tIdx]);
  else tSnap[tIdx] = tourCapture();
  // 동작이 있는 단계는 다시 실행되므로 그 뒤 단계의 스냅샷은 무효가 된다
  if(s.act) tSnap.length = tIdx + 1;
  $("tCh").textContent    = TOUR_CH[tIdx];
  $("tNum").textContent   = `${tIdx+1} / ${TOUR.length}`;
  $("tTitle").textContent = s.title;
  $("tBody").innerHTML    = s.body;
  $("tPrev").disabled = tIdx === 0;
  $("tNext").textContent = tIdx === TOUR.length-1 ? "마치기" : "다음";
  [...$("tBar").children].forEach((el,i)=>{
    el.classList.toggle("done", i < tIdx);
    if(i >= tIdx) el.querySelector("b").style.width = "0";
  });
  tourHash();
  tourPlace();
  // 단계 진입 상태로 되돌린 뒤 실행하므로 중복 생성되지 않는다
  // 버튼을 누른 뒤에는 스포트라이트를 노선도로 옮긴다. 안 그러면 방금 바뀐 그림이
  // 어두운 막 아래 깔려 무엇이 달라졌는지 안 보인다 (12단계에서 특히 심했다)
  if(s.act) tLater(()=>{
    s.act();
    if(s.sel !== ".map"){ tSpot = ".map"; }
    tourPlace();
  }, 550);
  const dur = Math.min(9500, 3600 + s.body.replace(/<[^>]+>/g,"").length * 55) + (s.act ? 1400 : 0);
  tourTimer(dur);
}

// 스크롤 중에는 스크롤을 다시 건드리지 않고 구멍·말풍선 자리만 맞춘다
function tourSync(){ tourPlace(false); }

function tourPlace(mayScroll){
  if(!tEls) return;
  const s = TOUR[tIdx];
  const tipH = tEls.tip.offsetHeight;
  // 넓은 화면: 노선도 패널 바로 아래에 일정한 여백을 두고 붙인다 (오른쪽 조작판과 좌우로 어긋나 가리지 않는다)
  // 좁은 화면: 붙일 빈 자리가 없으므로 화면 아래 고정 + 페이지 여백 확보
  const wide = innerWidth >= 900;
  if(wide) document.body.style.removeProperty("--tour-pad");
  else      document.body.style.setProperty("--tour-pad", (tipH + 60) + "px");

  // 지금 눌린 곳(주)과, 동작 뒤 함께 밝힐 노선도(부).
  // 좁은 화면은 조작판이 노선도 아래로 내려가 둘이 한 화면에 못 들어온다.
  // 그때는 예전처럼 한 곳만 비추되 결과(노선도) 쪽을 보여준다
  const twoUp = CUTOUT_OK && wide;
  const el  = s.sel ? document.querySelector(s.sel) : null;
  const el2 = (tSpot && twoUp && tSpot !== s.sel) ? document.querySelector(tSpot) : null;
  const solo = (!twoUp && tSpot) ? document.querySelector(tSpot) : el;
  if(solo && mayScroll !== false){
    // 넓은 화면은 화면 안에만 들어오면 되고, 좁은 화면은 말풍선 위까지만 허용된다
    const top = 12, bottom = wide ? innerHeight - 12 : innerHeight - tipH - 22 - 12;
    const r0 = solo.getBoundingClientRect();
    if(r0.bottom > bottom)   scrollBy(0, Math.min(r0.bottom - bottom, r0.top - top));
    else if(r0.top < top)    scrollBy(0, r0.top - top);
  }
  const P = 8;
  const box = e => { const r = e.getBoundingClientRect();
    return { x:r.left-P, y:r.top-P, w:r.width+P*2, h:r.height+P*2 }; };
  const put = (node, b) => { if(!b){ node.style.opacity = 0; return; }
    node.style.opacity = 1;
    Object.assign(node.style, { top:b.y+"px", left:b.x+"px", width:b.w+"px", height:b.h+"px" }); };

  const b1 = solo ? box(solo) : null, b2 = el2 ? box(el2) : null;
  put(tEls.hole, b1);
  put(tEls.hole2, b2);

  // 스크롤이 끝난 뒤 말풍선 자리를 잡는다.
  // 노선도 패널 아래에는 이제 진행 순서·로그가 있다. 거기만 보고 붙이면 그 둘을 덮으므로
  // "밝힌 대상의 아래끝"까지 함께 본다. 아래에 자리가 없으면 대상 위로 뒤집는다
  if(wide){
    const m = document.querySelector(".panel.map").getBoundingClientRect();
    const limit = innerHeight - tipH - 22;
    let top = Math.max(m.bottom, b1 ? b1.y + b1.h : 0) + TOUR_DOCK;
    if(top > limit) top = Math.min(limit, (b1 ? b1.y : m.top) - tipH - TOUR_DOCK);
    tEls.tip.style.top = Math.max(12, top) + "px";
    tEls.tip.style.bottom = "auto";
    tEls.tip.style.left = (m.left + m.width/2) + "px";   // 노선도 폭에 맞춰 중앙. 오른쪽 조작판을 가리지 않는다
  } else {
    tEls.tip.style.top = "auto"; tEls.tip.style.bottom = "22px"; tEls.tip.style.left = "50%";
  }

  if(CUTOUT_OK){
    // 화면 전체에서 밝힐 사각형들을 빼낸다 (evenodd)
    const cut = b => b ? ` M${b.x},${b.y}h${b.w}v${b.h}h${-b.w}z` : "";
    tEls.mask.style.clipPath = b1
      ? `path(evenodd,"M0,0h${innerWidth}v${innerHeight}h${-innerWidth}z${cut(b1)}${cut(b2)}")`
      : "none";
  }
}

function tourTimer(dur){
  const bar = $("tBar").children[tIdx].querySelector("b");
  tT0 = tPauseAt = performance.now();
  const tick = now => {
    if(!tPlaying){ tRaf = requestAnimationFrame(tick); return; }
    const k = Math.min(1, Math.max(0, (now - tT0) / dur));
    bar.style.width = (k*100) + "%";
    if(k < 1) tRaf = requestAnimationFrame(tick);
    else tourGo(tIdx + 1);
  };
  tRaf = requestAnimationFrame(tick);
}

function tourToggle(){
  tPlaying = !tPlaying;
  // 멈춰 있던 시간만큼 시작 시각을 미룬다. 이어보기가 멈춘 자리에서 이어지도록
  if(tPlaying) tT0 += performance.now() - tPauseAt;
  else tPauseAt = performance.now();
  $("tPlay").textContent = tPlaying ? "일시정지" : "이어보기";
}

function tourEnd(){
  tClear(); cancelAnimationFrame(tRaf);
  window.removeEventListener("resize", tourPlace);
  window.removeEventListener("scroll", tourSync);
  document.body.classList.remove("tour-on");
  document.body.style.removeProperty("--tour-pad");
  if(tEls){
    tEls.mask.remove(); tEls.hole.remove(); tEls.hole2.remove(); tEls.tip.remove(); tEls = null;
    try { history.replaceState(null, "", location.pathname + location.search); }
    catch(e) { /* file:// 등에서 막히면 그냥 둔다 */ }
  }
}

$("btnTour").onclick = ()=>tourStart();
document.addEventListener("keydown", e=>{
  if(!tEls) return;
  if(e.key === "Escape") tourEnd();
  if(e.key === "ArrowRight") tourGo(tIdx+1);
  if(e.key === "ArrowLeft") tourGo(tIdx-1);
  if(e.key === " "){ e.preventDefault(); tourToggle(); }
});

fresh(); render();

// 웹폰트가 늦게 오면 첫 렌더는 대체 글꼴로 폭을 잰 상태다. 로드되면 다시 재서 그린다
if(document.fonts && document.fonts.ready)
  document.fonts.ready.then(()=>{ _wcache.clear(); render(); });

// #step=13 으로 열면 그 단계부터 재개한다 (쉬는 시간 뒤 이어보기)
const tStep = /^#step=(\d+)$/.exec(location.hash);
if(tStep) tourStart(+tStep[1] - 1);
</script>
